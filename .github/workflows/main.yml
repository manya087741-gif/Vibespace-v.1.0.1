name: Build Stability CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Type Check and Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=dev || npm install --include=dev

      - name: Run Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Automated Tests (npm test)
        run: npm test

      - name: Run Production Build (npm run build)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html missing after build" && exit 1)
          echo "Production build verified successfully."
